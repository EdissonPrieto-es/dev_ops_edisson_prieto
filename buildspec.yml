version: 0.2

# AWS CodeBuild (etapa Build de CodePipeline):
#   1. ejecuta las pruebas unitarias (si fallan, se detiene: no se construye ni se publica imagen),
#   2. construye la imagen del contenedor y la sube a ECR con el SHA corto del commit como tag,
#   3. entrega a CodeDeploy (ECS blue/green) imageDetail.json, taskdef.json y appspec.yaml.
# Las pruebas usan SQLite en memoria (TestConfig), no necesitan base de datos externa.
#
# Variables de entorno del proyecto CodeBuild (Privileged mode ON para usar Docker):
#   AWS_ACCOUNT_ID, AWS_DEFAULT_REGION (us-east-1), IMAGE_REPO_NAME (devops-flask-api)

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install --upgrade pip
      - pip install -r requirements-dev.txt

  pre_build:
    commands:
      - echo "Ejecutando pruebas unitarias"
      - mkdir -p reports
      - python -m pytest -q --junitxml=reports/pytest.xml
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - REPOSITORY_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME"
      - IMAGE_TAG="$(echo "${CODEBUILD_RESOLVED_SOURCE_VERSION:-local}" | cut -c1-7)"

  build:
    commands:
      - echo "Construyendo imagen $REPOSITORY_URI:$IMAGE_TAG"
      - docker build --build-arg APP_VERSION="$IMAGE_TAG" -t "$REPOSITORY_URI:$IMAGE_TAG" .

  post_build:
    commands:
      - docker push "$REPOSITORY_URI:$IMAGE_TAG"
      - printf '{"ImageURI":"%s"}' "$REPOSITORY_URI:$IMAGE_TAG" > imageDetail.json
      - sed -i "s/<ACCOUNT_ID>/$AWS_ACCOUNT_ID/g" taskdef.json
      - cat imageDetail.json

reports:
  pytest:
    files:
      - reports/pytest.xml
    file-format: JUNITXML

artifacts:
  files:
    - imageDetail.json
    - taskdef.json
    - appspec.yaml
