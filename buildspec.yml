version: 0.2

# AWS CodeBuild: instala dependencias, ejecuta las pruebas unitarias y genera el
# bundle (zip) que luego se desplegara en Elastic Beanstalk. Solo construye, no despliega.
# Las pruebas usan SQLite en memoria (TestConfig), no necesitan una base de datos externa.

env:
  variables:
    BUNDLE_NAME: dev-ops-app

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install --upgrade pip
      - pip install -r requirements-dev.txt

  pre_build:
    commands:
      - echo "Ejecutando pruebas unitarias"
      - mkdir -p reports
      - python -m pytest -q --junitxml=reports/pytest.xml

  build:
    commands:
      # Si las pruebas fallan, CodeBuild detiene la fase y no se genera el artefacto.
      - VERSION="${CODEBUILD_RESOLVED_SOURCE_VERSION:-local}"
      - VERSION="$(echo "$VERSION" | cut -c1-7)"
      - echo "Generando bundle $BUNDLE_NAME-$VERSION.zip"
      - mkdir -p build dist
      - echo "$VERSION" > VERSION
      - >
        zip -r "dist/$BUNDLE_NAME-$VERSION.zip"
        .ebextensions Procfile requirements.txt wsgi.py app VERSION
        -x "*/__pycache__/*" "*.pyc"
      - unzip -l "dist/$BUNDLE_NAME-$VERSION.zip"

reports:
  pytest:
    files:
      - reports/pytest.xml
    file-format: JUNITXML

artifacts:
  files:
    - dist/*.zip
  discard-paths: yes
  name: $BUNDLE_NAME-bundle
